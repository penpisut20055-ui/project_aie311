name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend - start check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manifest
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/manifest
      GEMINI_API_KEY: ci-dummy-key # ไม่ได้เรียก AI จริงในขั้นนี้
      PORT: 5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: เปิด backend กับ PostgreSQL จริง แล้วเช็ก API
        run: |
          node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:5000/api/health && break; sleep 1; done
          curl -fsS http://localhost:5000/api/health
          curl -fsS http://localhost:5000/api/portfolio | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const d=JSON.parse(s);
              if(!d.group||!d.group.group_name) throw new Error('ไม่มีข้อมูลกลุ่ม');
              if(!Array.isArray(d.members)||d.members.length===0) throw new Error('ไม่มีข้อมูลสมาชิก');
              console.log('portfolio OK:', d.group.group_name, d.members.length, 'members');
            });"
          curl -fsS http://localhost:5000/api/chat > /dev/null
      - name: แสดง log ของ backend (ถ้าล้มเหลว)
        if: failure()
        run: cat server.log

  client:
    name: Frontend - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy
    needs: [backend, client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy backend (Render)
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Deploy frontend (Vercel)
        if: env.VERCEL_TOKEN != ''
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: แจ้งเตือนถ้ายังไม่ได้ตั้ง secrets
        if: env.RENDER_DEPLOY_HOOK_URL == '' || env.VERCEL_TOKEN == ''
        run: echo "::warning::ยังตั้ง secrets สำหรับ deploy ไม่ครบ ดูวิธีใน README หัวข้อ CI/CD"
