# Render Blueprint สำหรับ backend (Express) — โฟลเดอร์ backend/
# ตาราง + ข้อมูลกลุ่มจะถูกสร้างอัตโนมัติตอน backend เริ่มทำงาน (initDatabase ใน server.js)
services:
  - type: web
    name: manifest-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false # ให้ GitHub Actions เป็นคนสั่ง deploy หลังเช็กผ่าน
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
