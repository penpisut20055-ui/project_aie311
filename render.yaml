# Render Blueprint สำหรับ backend (Express) — โฟลเดอร์ backend/
# ตาราง + ข้อมูลกลุ่มจะถูกสร้างอัตโนมัติตอน backend เริ่มทำงาน (initDatabase ใน server.js)
services:
  - type: web
    name: project-aie311
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true # Render deploy ใหม่เองทุกครั้งที่ push เข้า main
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
